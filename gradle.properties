org.gradle.jvmargs=-Xmx4096M -Dkotlin.daemon.jvm.options="-Xmx4096M" -Dfile.encoding=UTF-8 -XX:+UseParallelGC
android.useAndroidX=true
android.enableR8.fullMode=true
android.enableAppCompileTimeRClass=true
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
# File-system watching: incremental builds reuse the previous file snapshot instead of re-scanning
# the whole tree.
org.gradle.vfs.watch=true
# Keep a warm Gradle daemon between builds.
org.gradle.daemon=true
# Kotlin incremental compilation (default on; pinned explicitly).
kotlin.incremental=true
# Run the Kotlin compiler in the Gradle daemon to avoid a second JVM for this small build.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.injected.testOnly=false
android.nonFinalResIds=false